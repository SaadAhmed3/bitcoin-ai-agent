{# Simple line icons for the sidebar (20x20, stroke = currentColor, so they follow the light and dark themes). #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
{%- if name == "overview" %}<path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/>
{%- elif name == "market" %}<path d="M3 17h14M4 13l4-4 3 3 5-6"/>
{%- elif name == "news" %}<path d="M4 4h10v12H4zM14 7h2v8.5a1 1 0 0 1-2 0M6.5 7h5M6.5 10h5M6.5 13h3"/>
{%- elif name == "signal" %}<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3"/><path d="M10 1.5v3M10 15.5v3"/>
{%- elif name == "research" %}<path d="M8 3h4M9 3v5l-4.6 7.6A1 1 0 0 0 5.3 17h9.4a1 1 0 0 0 .9-1.4L11 8V3M6.5 13h7"/>
{%- elif name == "paper" %}<path d="M3 6.5h14v10H3zM3 6.5l10-3v3M13.5 11.5h3"/>
{%- elif name == "alerts" %}<path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 2h-13zM8.5 18.2h3"/>
{%- elif name == "assistant" %}<path d="M3 4h14v9H8.5L5 16v-3H3z"/>
{%- elif name == "system" %}<path d="M3 3.5h14v5H3zM3 11.5h14v5H3zM6 6h.01M6 14h.01"/>
{%- elif name == "settings" %}<circle cx="10" cy="10" r="3"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M4.3 15.7l2.1-2.1M13.6 6.4l2.1-2.1"/>
{%- elif name == "general" %}<path d="M3 6h14M3 14h14"/><circle cx="7.5" cy="6" r="2"/><circle cx="12.5" cy="14" r="2"/>
{%- elif name == "watchlist" %}<path d="M7.5 5h9.5M7.5 10h9.5M7.5 15h9.5M3.5 5h.01M3.5 10h.01M3.5 15h.01"/>
{%- elif name == "collapse" %}<path d="M12.5 4.5L7 10l5.5 5.5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# The sidebar toggle next to the logo: collapses the sidebar to an icon rail (desktop only). #}
{% macro collapse_button() -%}
<button type="button" class="icon-btn collapse-btn" id="collapseBtn" aria-controls="sidebar" aria-expanded="true"
        aria-label="Collapse sidebar" title="Collapse sidebar">{{ icon("collapse") }}</button>
{%- endmacro %}
