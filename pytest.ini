[pytest]
testpaths = tests
pythonpath = . tests
# The Playwright UI tests (tests/e2e, marker "e2e") start a browser and are excluded by default.
# Run them with:  python -m pytest -m e2e      (a later -m on the command line replaces this one)
addopts = -m "not e2e"
markers =
    e2e: Playwright end-to-end UI tests (python -m pytest -m e2e)
    smoke: read-only e2e checks that are safe against the real running app (E2E_BASE_URL)
